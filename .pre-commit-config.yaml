exclude: "image-harvester/src/image_harvester_test"
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.12
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
- repo: https://github.com/DetachHead/basedpyright-prek-mirror
  rev: 1.39.9
  hooks:
      - id: basedpyright
