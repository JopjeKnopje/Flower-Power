[project]
name = "image-harvester"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "joppe", email = "jboeve009@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "torch==2.11.0+cu126",
    "torchvision==0.26.0",
    "ultralytics>=8.4.51",
]

[project.scripts]
image-harvester = "image_harvester:main"


[tool.uv.sources]
torch = [
  { index = "pytorch-cu126" },
]
torchvision = [
  { index = "pytorch-cu126" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

