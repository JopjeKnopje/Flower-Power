version = 1
revision = 3
requires-python = ">=3.13"

[manifest]
members = [
    "flower-power",
    "flower-sim",
]

[[package]]
name = "flower-power"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "flower-sim" },
]

[package.metadata]
requires-dist = [{ name = "flower-sim", editable = "flower-sim" }]

[[package]]
name = "flower-sim"
version = "0.1.0"
source = { editable = "flower-sim" }
